        market_data_available: true
        verified_at: "2026-09-21T21:18:47.701Z"
        source: "GET /api/v2/mix/market/contracts?productType=USDT-FUTURES&symbol=SP500USDT"
        report: "output/instrument-verification/report-2026-09-21T21-18-47-701Z.json"
      strategy_eligibility: enabled
      execution_availability: signal_only
      supported_indicators: [ema, rsi, atr, volume, parabolic_sar]
      risk_profile: standard

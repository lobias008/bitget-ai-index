name: the-morning-sword
display_name: "The Morning Sword"
display_name_i18n:
  en: "The Morning Sword"
  zh: "The Morning Sword"
  zh-tw: "The Morning Sword"
  es: "La Espada de la Manana"
  ja: "The Morning Sword"
  vi: "Thanh Kiem Binh Minh"
version: "1.0.0"
description: "Multi-asset GetClaw confluence strategy for BTC, Gold, Oil proxy, and S&P exposure."
description_i18n:
  en: "Multi-asset GetClaw confluence strategy for BTC, Gold, Oil proxy, and S&P exposure."
  zh: "Multi-asset GetClaw confluence strategy for BTC, Gold, Oil proxy, and S&P exposure."
  zh-tw: "Multi-asset GetClaw confluence strategy for BTC, Gold, Oil proxy, and S&P exposure."
  es: "Estrategia multi-activo de confluencia GetClaw para BTC, oro, proxy de petroleo y S&P."
  ja: "Multi-asset GetClaw confluence strategy for BTC, Gold, Oil proxy, and S&P exposure."
  vi: "Chien luoc GetClaw da tai san cho BTC, vang, dai dien dau tho va S&P."
long_description: |
  The Morning Sword is a multi-asset momentum and pullback Playbook designed to capture orderly continuation after a broad trend has already aligned. It scans liquid Bitget contract markets across digital assets, precious metals, an oil-linked proxy, and equity-index exposure, then waits for price to return toward a higher-quality participation zone before issuing a signal. The thesis is that asymmetric trades are strongest when the larger trend, pullback behavior, liquidity, and momentum temperature all agree.

  The strategy enters long only when the higher timeframe trend stack supports upside continuation and the lower timeframe pullback shows renewed participation. It avoids chasing extended candles and instead looks for a controlled reset where price, volume behavior, and momentum sit in a balanced zone. Asset-specific gates make the decision stricter: gold is allowed only during the most liquid western sessions, BTC must pass a funding sanity check, and oil-linked exposure requires additional trend confirmation.

  Exits are built around turning early strength into protected optionality. The first profit event reduces exposure and immediately converts the remaining trade into a breakeven protected runner. The rest of the position follows a trend-trailing stop so larger directional moves can keep paying without letting a winner turn into an avoidable loss.

  Subscribers can tune the trading symbol list, margin budget, leverage, risk budget, stop distance behavior, session gates, and the current daily loss input used by the circuit breaker. Higher leverage and larger margin budgets increase both opportunity and drawdown. Stricter session and funding gates reduce signal count but can improve selectivity.

  The main risk is that multi-asset trend systems underperform during sideways markets, event gaps, thin liquidity, and fast reversals after macro news. Funding spikes, inventory events, and session transitions can also distort execution quality. This Playbook is a disciplined signal framework, not a guarantee of profit, and past performance or clean confluence does not remove market risk.
market_type: contract
trading_symbols:
  - BTCUSDT
  - XAUUSDT
  - AXTIUSDT
  - SP500USDT
tags:
  - getclaw
  - multi-asset
  - trend
  - confluence
  - bitget
schedule:
  cron: "0 */4 * * *"
  tz: "Asia/Shanghai"
decision_mode: deterministic
backtest_support: none
runtime_profile: deterministic
execution_mode: signal_only
follow_trade_supported: false
strategy_config:
  trading_symbols:
    - BTCUSDT
    - XAUUSDT
    - AXTIUSDT
    - SP500USDT
  # -------------------------------------------------------------------------
  # Instrument registry (configuration-driven). See ARCHITECTURE.md.
  #
  # Gate applicability used to be hardcoded per symbol inside src/main.py
  # (`symbol != "BTCUSDT"`, `symbol != "XAUUSDT"`, `symbol == "AXTIUSDT"`).
  # It now lives here. Every value below reproduces the previous hardcoded
  # behavior EXACTLY for the four verified instruments; src/instruments.py
  # falls back to these same defaults if the block is missing.
  #
  # `symbol_verification` records provenance, not permission:
  #   native_bitget_contract   - core Bitget crypto contract
  #   documented_in_sdk_docs   - named as a real pair in the installed SDK docs
  #   verified_public_api      - confirmed by a recorded live Bitget public
  #                              API response; see the symbol's
  #                              verified_metadata block and the report file
  #   inherited_unverified     - carried over from the original authoring
  #                              session; NOT confirmed in SDK docs and must be
  #                              re-checked against Bitget's public contracts API
  # -------------------------------------------------------------------------
  symbol_roles:
    BTCUSDT:
      display_name: "Bitcoin"
      asset_class: crypto
      market_type: contract
      settlement: crypto_perpetual
      trading_session: continuous_24x7
      symbol_verification: verified_public_api
      verified_metadata:
        product_type: USDT-FUTURES
        market: contract
        trading_status: normal
        price_precision: 1
        quantity_precision: 4
        min_order_size: 0.0001
        size_multiplier: 0.0001
        base_coin: BTC
        quote_coin: USDT
        market_data_available: true
        verified_at: "2026-09-21T21:18:41.818Z"
        source: "GET /api/v2/mix/market/contracts?productType=USDT-FUTURES&symbol=BTCUSDT"
        report: "output/instrument-verification/report-2026-09-21T21-18-47-701Z.json"
      strategy_eligibility: enabled
      execution_availability: signal_only
      supported_indicators: [ema, rsi, atr, volume, parabolic_sar]
      risk_profile: standard
      note: "BTC crypto perpetual"
      gates:
        funding:
          applies: true
          abs_limit_pct: 0.05
        session:
          applies: false
        parabolic_sar:
          applies: false
    XAUUSDT:
      display_name: "Gold"
      asset_class: metal
      market_type: contract
      settlement: rwa_perpetual
      trading_session: london_new_york
      symbol_verification: verified_public_api
      verified_metadata:
        product_type: USDT-FUTURES
        market: contract
        trading_status: normal
        price_precision: 2
        quantity_precision: 2
        min_order_size: 0.01
        size_multiplier: 0.01
        base_coin: XAU
        quote_coin: USDT
        market_data_available: true
        verified_at: "2026-09-21T21:18:43.941Z"
        source: "GET /api/v2/mix/market/contracts?productType=USDT-FUTURES&symbol=XAUUSDT"
        report: "output/instrument-verification/report-2026-09-21T21-18-47-701Z.json"
      strategy_eligibility: enabled
      execution_availability: signal_only
      supported_indicators: [ema, rsi, atr, volume, parabolic_sar]
      risk_profile: standard
      note: "Gold RWA perpetual; confirmed as a Bitget RWA contract in the SDK docs"
      gates:
        funding:
          applies: false
        session:
          applies: true
          windows_utc: [[7, 10], [13, 16]]
        parabolic_sar:
          applies: false
    AXTIUSDT:
      display_name: "WTI Oil (RWA proxy)"
      asset_class: commodity
      market_type: contract
      settlement: rwa_perpetual
      trading_session: continuous_with_event_risk
      symbol_verification: verified_public_api
      verified_metadata:
        product_type: USDT-FUTURES
        market: contract
        trading_status: normal
        price_precision: 2
        quantity_precision: 2
        min_order_size: 0.01
        size_multiplier: 0.01
        base_coin: AXTI
        quote_coin: USDT
        market_data_available: true
        verified_at: "2026-09-21T21:18:45.827Z"
        source: "GET /api/v2/mix/market/contracts?productType=USDT-FUTURES&symbol=AXTIUSDT"
        report: "output/instrument-verification/report-2026-09-21T21-18-47-701Z.json"
      strategy_eligibility: enabled
      execution_availability: signal_only
      supported_indicators: [ema, rsi, atr, volume, parabolic_sar]
      risk_profile: standard
      note: "Oil-linked RWA proxy; requested OILUSDT was not found in Bitget public contracts"
      gates:
        funding:
          applies: false
        session:
          applies: false
        parabolic_sar:
          applies: true
    SP500USDT:
      display_name: "S&P 500 Index"
